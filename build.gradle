// Hive Sight: bee hives made legible. Universal Fabric mod (environment "*"):
// the server half syncs bee occupancy to clients and performs the eject; the
// client half draws the HUD card and owns the config screen. Depends on
// MenuKit (HUD panel) only; nothing here touches slots, so no SlotKit
// (formerly MenuKit: Containers).
//
// Build: `./gradlew :hive-sight:build` from the workspace root (the composite
// build in ~/Projects/Minecraft/Trevlar Mods). Test scene:
// `test-gallery/run-scene.sh hive-sight <scene>`.

plugins {
    // Loom 1.17 is the 26.2-era line; the version is pinned at the workspace root.
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'java'
    id 'com.modrinth.minotaur' version '2.+'
}

version = property('hivesight_version')
group   = property('maven_group')

base.archivesName = 'hive-sight'

java {
    // Minecraft 26.x runs on Java 25.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    // ModMenu, from Terraformers' Maven.
    maven { url 'https://maven.terraformersmc.com/releases/' }
    // YACL's 26.2 builds (3.9.x) are only on this Maven repository.
    maven { url 'https://api.modrinth.com/maven' }
}

// MenuKit 6.0.0 splits into main and client source sets. A project
// dependency sees only main, so its client half (HudPanel and the rest of the
// HUD API HiveLook uses) is added by output below, which needs MenuKit
// evaluated first.
evaluationDependsOn(':menukit')

dependencies {
    // 26.x: the game is unobfuscated, so there is no mappings line and mod deps
    // use the standard java configurations.
    minecraft "com.mojang:minecraft:${property('minecraft_version')}"
    implementation "net.fabricmc:fabric-loader:${property('loader_version')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_version')}"

    // ModMenu shows the config screen from the mods list. Soft dep at
    // runtime; compileOnly for the API, localRuntime for the dev launch.
    compileOnly "com.terraformersmc:modmenu:21.0.0"
    localRuntime "com.terraformersmc:modmenu:21.0.0"

    // YACL, the config-screen framework, is bundled into the jar (Jar-in-Jar).
    // implementation = compile + dev runtime; include = JIJ.
    implementation "maven.modrinth:yacl:3.9.7+26.3-fabric"
    include        "maven.modrinth:yacl:3.9.7+26.3-fabric"

    // The HUD card renders through MenuKit's HudPanel. Only MenuKit is on the
    // classpath, which proves nothing here reaches SlotKit.
    implementation project(':menukit')
    // MenuKit's client half, which the project dep above leaves out (Hive
    // Sight has no split source set of its own, so this is a plain
    // implementation dep, not clientImplementation).
    implementation rootProject.project(':menukit').sourceSets.client.output
}

loom {
    runs {
        client { ideConfigGenerated = false }
        server { ideConfigGenerated = false }
        // Test Gallery: boots straight into the generated test world in run/saves/TestGallery.
        // Generate it with `test-gallery/run-scene.sh hive-sight <scene>` (which also runs this).
        testGallery {
            inherit client
            name 'Test Gallery'
            programArgs '--quickPlaySingleplayer', 'TestGallery'
            ideConfigGenerated = false
        }
    }
}

jar {
    from('LICENSE') { rename { "${it}_${project.name}" } }
}

// Stamp the real project version into fabric.mod.json at build. The manifest
// declares "version": "${version}"; a hardcoded manifest version silently
// breaks every dependency gate against this mod.
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

// ── Modrinth Publishing ────────────────────────────────────────────────
// Lead creates the Modrinth project (new-mod-setup.md step 5) and fills in
// the project id here. Only Lead runs these tasks.
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "sLseApU8"
    versionNumber = property('hivesight_version')
    versionName = "Hive Sight ${property('hivesight_version')}"
    versionType = "release"
    // ci-cd.md stage 5: the player-facing changelog lives in changelog.md, one entry,
    // overwritten each release (git keeps the history).
    changelog = file('changelog.md').text
    // ci-cd.md stage 7: the README is the public description; `modrinthSyncBody` pushes it.
    syncBodyFrom = file('README.md').text
    // 26.x: no remap step — `jar` IS the shippable artifact.
    uploadFile = jar
    gameVersions = [property('minecraft_version')]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
        required.project "menukit"
    }
}

// The shipped jar must self-report the bumped version. A jar that
// says the wrong version silently breaks every dependency gate against it, so this
// fails the build instead of relying on someone remembering to unzip and look.
tasks.register('verifyJarVersion') {
    dependsOn 'jar'
    doLast {
        def jar = tasks.named('jar').get().archiveFile.get().asFile
        def modJson = zipTree(jar).matching { include 'fabric.mod.json' }.singleFile
        def stamped = new groovy.json.JsonSlurper().parse(modJson).version
        if (stamped != project.version.toString()) {
            throw new GradleException("${jar.name}: fabric.mod.json says ${stamped}, expected ${project.version}")
        }
        println "verifyJarVersion: ${jar.name} reports ${stamped}"
    }
}
build.dependsOn verifyJarVersion

// This mod must pin each Kit it depends on to the major.minor it was built against.
// The floor guarantees every call it makes exists at load time; the ceiling stops a future
// breaking major from loading against code that never saw it. Both halves matter: a floor
// alone lets a Kit rename an API out from under a shipped jar, and the player gets a
// NoSuchMethodError hours into a session instead of a refusal at launch.
// Commas are rejected outright: Fabric parses ">=5.0.0,<6.0.0" without complaint and the
// resulting predicate then matches NO version at all, which silently disables the mod.
// One check per Kit, generalised from the old MenuKit-only check.
// menukit-containers fails outright, since Containers is SlotKit now.
tasks.register('verifyKitRanges') {
    def src = file('src/main/resources/fabric.mod.json')
    def kitVersions = [
        menukit : (project.findProperty('menukit_version') ?: '').toString(),
        slotkit : (project.findProperty('slotkit_version') ?: '').toString(),
    ]
    inputs.file src
    kitVersions.each { id, version -> inputs.property "${id}_version", version }
    doLast {
        def depends = new groovy.json.JsonSlurper().parse(src).depends ?: [:]
        if (depends.containsKey('menukit-containers')) {
            throw new GradleException(
                "fabric.mod.json: depends on 'menukit-containers'. Containers is SlotKit now; " +
                "depend on 'slotkit' instead. See guidelines/ci-cd.md, 'MenuKit version pinning'.")
        }
        kitVersions.each { id, kitVersion ->
            def declared = depends[id]?.toString()
            if (declared == null) return
            if (kitVersion.isEmpty()) {
                throw new GradleException(
                    "fabric.mod.json: depends on '${id}', but no ${id}_version property is set.")
            }
            // Floor at major.minor, not just major: a minor can add API (MenuKit 5.1.0 added
            // SlotOperations/SlotGroups) that a consumer built against it calls. Flooring at the
            // major alone would let that jar load on the unrelated 5.0.0 and die with
            // NoSuchMethodError, which is exactly the failure this check exists to prevent.
            def parts = kitVersion.replaceAll(/\+.*$/, '').tokenize('.')
            def major = Integer.parseInt(parts[0])
            def minor = Integer.parseInt(parts[1])
            def expected = ">=${major}.${minor}.0 <${major + 1}.0.0".toString()
            if (declared.contains(',')) {
                throw new GradleException(
                    "fabric.mod.json: '${id}' is '${declared}'. Fabric accepts a comma here and the " +
                    "predicate then matches no version at all. Separate the bounds with a space.")
            }
            if (declared != expected) {
                throw new GradleException(
                    "fabric.mod.json: '${id}' is '${declared}', expected '${expected}'. This mod is " +
                    "built against ${id} ${kitVersion}, so it floors at that major.minor and stops " +
                    "below the next major. See guidelines/ci-cd.md, 'MenuKit version pinning'.")
            }
            println "verifyKitRanges: ${id} '${expected}' (built against ${kitVersion})"
        }
    }
}
build.dependsOn verifyKitRanges
